<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LockedNet - Home Devices</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Home Devices</h1>
        <p class="subtitle">Select module to activate</p>
        
        <form method="POST" action="/devices">
            <button type="submit" name="device_action" value="bD|Boil|wifi">Boil the water</button>
            <button type="submit" name="device_action" value="mD|Measure|wifi">Measure the air</button>
            <button type="submit" name="device_action" value="Ud|Voltage|wifi">Check voltage</button>
            <button type="submit" name="device_action" value="eH|Fresh|wifi">Fresh air</button>
            <button type="submit" name="device_action" value="eH|Humidify|wifi">Humidify the air</button>
            <button type="submit" name="device_action" value="eH|Warm|wifi">Warm the room</button>
        </form>

        {% if message %}
            <p class="success">{{ message }}</p>
        {% endif %}
        {% if serial_error %}
            <p class="error">{{ serial_error }}</p>
        {% endif %}
        
        <a href="{{ url_for('menu') }}" class="btn" style="margin-top: 25px;">Back to Menu</a>
    </div>
</body>
</html>
